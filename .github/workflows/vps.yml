name: Free SSH VPS (Ngrok Direct Log)

on:
 workflow_dispatch:

jobs:
 start-vps:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout Repository
 uses: actions/checkout@v4

 - name: Setup Password Runner & Root
 run: |
 echo "runner:admin123" | sudo chpasswd
 echo "root:admin123" | sudo chpasswd

 - name: Install & Run Ngrok Tunnel
 env:
 NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
 run: |
 # 1. Install Ngrok CLI Resmi (Cara Bersih)
 curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
 echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
 sudo apt-get update && sudo apt-get install -y ngrok

 # 2. Autentikasi Token Ngrok
 ngrok config add-authtoken $NGROK_TOKEN

 # 3. Jalankan Tunnel SSH (Port 22) di background
 ngrok tcp 22 --log=stdout > /dev/null &
 sleep 3

 # 4. Ambil URL & Port dari API Ngrok lokal lalu tampilkan di Log
 SSH_CMD=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' | sed 's/tcp:\/\//ssh runner@/' | sed 's/:/ -p /')

 echo "=========================================================="
 echo "🚀 PERINTAH KONEKSI SSH ANDA:"
 echo "👉 $SSH_CMD"
 echo "🔑 PASSWORD: admin123"
 echo "=========================================================="

 # 5. Tahan Runner agar tidak langsung mati (Keep-Alive)
 while true; do sleep 3600; done
